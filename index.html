<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* =====================================================================
   IceFlow Plant OS — Configuration & State Models
===================================================================== */
const PRICE_PER_UNIT = 80, UNITS_PER_BOX = 25, KG_PER_UNIT = 2;

const CUSTOMERS = [
  { name:'Kaveri Fisheries',       short:'Kaveri',    sector:'Seafood export',     w:.28 },
  { name:'Anand Cold Storage',     short:'Anand',     sector:'3PL cold chain',     w:.22 },
  { name:'Bluewave Sea Foods',     short:'Bluewave',  sector:'Seafood processing', w:.18 },
  { name:'Meridian Grand Hotel',   short:'Meridian',  sector:'Hospitality',        w:.14 },
  { name:'Sri Balaji Ice House',   short:'Balaji',    sector:'Trade supplier',     w:.11 },
  { name:'Coastline Catering Co.', short:'Coastline', sector:'Catering',           w:.07 },
];

const PLANTS = [
  { id:'P1', name:'Tuticorin — Line 01', device:'EF-01', seed:20240612, oseed:77031, obase:2501, scale:1 },
  { id:'P2', name:'Madurai — Line 02',   device:'EF-02', seed:515031,  oseed:91277, obase:2901, scale:.65 },
];

function mulberry32(seed){ return function(){ seed|=0; seed=(seed+0x6D2B79F5)|0;
  let t=Math.imul(seed^(seed>>>15),1|seed); t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296; }; }

const startOfDay = d => { const x=new Date(d); x.setHours(0,0,0,0); return x; };
const fmtN   = n => Math.round(n).toLocaleString('en-IN');
const fmtINR = n => '₹' + Math.round(n).toLocaleString('en-IN');
const fmtK   = v => v>=1000 ? (v/1000).toFixed(v%1000===0?0:1)+'k' : ''+v;
const hhmm   = d => d.toTimeString().slice(0,5);

function timeLabel(d){
  const diff=Math.round((startOfDay(new Date())-startOfDay(d))/864e5);
  const pre= diff===0?'Today': diff===1?'Yesterday': d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric'});
  return pre+' · '+hhmm(d);
}

function buildData(plant){
  const rnd = mulberry32(plant.seed);
  const today = startOfDay(new Date());
  const days = [];
  for(let i=59;i>=0;i--){
    const d=new Date(today); d.setDate(d.getDate()-i);
    const dow=d.getDay();
    const base=(330+(59-i)*1.15+((dow===5||dow===6)?55:0)+(dow===2?-28:0))*plant.scale;
    const units=Math.max(120, Math.round((base+(rnd()-.5)*110)/5)*5);
    const byCustomer=CUSTOMERS.map(()=>0); let rem=units;
    for(let ci=0;ci<CUSTOMERS.length-1;ci++){
      let v=Math.round(units*CUSTOMERS[ci].w*(0.8+rnd()*0.4)/5)*5;
      v=Math.max(0,Math.min(v,rem)); byCustomer[ci]=v; rem-=v;
    }
    byCustomer[CUSTOMERS.length-1]=rem;
    days.push({date:d, units, byCustomer});
  }
  return days;
}

function buildOrders(plant){
  const rnd=mulberry32(plant.oseed); const list=[];
  const now = new Date();
  for(let di=53;di<=59;di++){
    const n=3+Math.floor(rnd()*3);
    for(let k=0;k<n;k++){
      let r=rnd(), ci=0; for(;ci<CUSTOMERS.length-1;ci++){ r-=CUSTOMERS[ci].w; if(r<=0) break; }
      const units=(2+Math.floor(rnd()*18))*25;
      const when=new Date();
      const day=new Date(); day.setDate(day.getDate()-(59-di));
      when.setTime(day.getTime());
      if(di===59){
        const nowH = now.getHours();
        const maxH = Math.max(5, nowH);
        const h = 5 + Math.floor(rnd() * Math.max(1, maxH - 5 + 1));
        const m = (h >= nowH) ? Math.floor(rnd() * Math.max(1, now.getMinutes())) : Math.floor(rnd() * 60);
        when.setHours(h, m, 0, 0);
      } else {
        when.setHours(5+Math.floor(rnd()*13), Math.floor(rnd()*60), 0, 0);
      }
      const s=rnd(); let status;
      if(di===59){
        const elapsedMins = (now.getTime() - when.getTime()) / 60000;
        if(elapsedMins < 20) status = s < .5 ? 'Crushing' : 'Loading bay';
        else if(elapsedMins < 90) status = s < .6 ? 'In transit' : 'Loading bay';
        else status = s < .75 ? 'Delivered' : 'In transit';
      }
      else if(di===58) status = s<.6?'Delivered':'In transit';
      else             status = 'Delivered';
      list.push({customer:CUSTOMERS[ci].name, units, when, status});
    }
  }
  list.sort((a,b)=>b.when-a.when);
  list.forEach((o,i)=>{ o.id='OI-'+(plant.obase-i); o.boxes=Math.ceil(o.units/UNITS_PER_BOX);
    o.amount=o.units*PRICE_PER_UNIT; o.timeLabel=timeLabel(o.when); });
  return list;
}

function rangeStats(days, n){
  const cur=days.slice(-n), prev=days.slice(-2*n,-n);
  const units=cur.reduce((s,d)=>s+d.units,0);
  const prevUnits=prev.reduce((s,d)=>s+d.units,0)||1;
  const boxes=Math.max(1,Math.round(units/UNITS_PER_BOX));
  const customers=CUSTOMERS.map((c,ci)=>({name:c.name,sector:c.sector,units:cur.reduce((s,d)=>s+d.byCustomer[ci],0)}))
    .map(c=>({...c, revenue:c.units*PRICE_PER_UNIT})).filter(c=>c.units>0)
    .sort((a,b)=>b.units-a.units);
  const tot=customers.reduce((s,c)=>s+c.units,0)||1;
  let sumPct = 0;
  const withFrac = customers.map(c => {
    const raw = (100 * c.units) / tot;
    const floor = Math.floor(raw);
    sumPct += floor;
    return { c, floor, frac: raw - floor };
  });
  let rem = 100 - sumPct;
  withFrac.slice().sort((a, b) => b.frac - a.frac).forEach((item, idx) => {
    item.c.pct = item.floor + (idx < rem ? 1 : 0);
  });
  return { units, revenue:units*PRICE_PER_UNIT, boxes, avg:UNITS_PER_BOX,
    delta:(units-prevUnits)/prevUnits*100, perDay:cur, priorPerDay:prev, customers };
}

function Clock({className}){
  const [s,setS]=useState('');
  useEffect(()=>{ const f=()=>setS(hhmm(new Date())+':'+new Date().getSeconds().toString().padStart(2,'0'));
    f(); const id=setInterval(f,1000); return()=>clearInterval(id); },[]);
  return <span className={`font-grot tabular-nums ${className||''}`}>{s}</span>;
}

function usePrefersReducedMotion(){
  const [r,setR]=useState(()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  useEffect(()=>{ const m=window.matchMedia('(prefers-reduced-motion: reduce)');
    const f=e=>setR(e.matches);
    m.addEventListener?m.addEventListener('change',f):m.addListener(f);
    return()=>m.removeEventListener?m.removeEventListener('change',f):m.removeListener(f); },[]);
  return r;
}

function ProductionLine(){
  const reduced=usePrefersReducedMotion();
  const [running,setRunning]=useState(!reduced);
  const [speed,setSpeed]=useState(1);
  const [sel,setSel]=useState(null);
  const speedRef=useRef(1); useEffect(()=>{speedRef.current=speed},[speed]);
  useEffect(()=>{ if(reduced) setRunning(false); },[reduced]);

  const init=()=>({ph:0,t:0,slabs:5,lifted:0,cycles:0,hidden:-1,fill:0,packed:138,packed0:138,nextPk:141,
    queue:[{id:138},{id:139},{id:140}],rollout:null,van:{boxes:[],count:0,id:7},
    doorOpen:false,cure:64,batch:217,refills:0,exposure:0,elapsed:0,trips:14});
  const M=useRef(init()).current;
  const [,force]=useState(0);
  const raf=useRef(),last=useRef();

  const advance=()=>{
    const done=PHASES[M.ph].id; M.t-=1;
    if(done==='lift'){ M.slabs--; M.lifted++; }
    if(done==='crush'){ M.cycles++; M.fill=Math.min(100,M.fill+100/3); }
    if(done==='seal'){ M.packed++; M.queue[0].ready=true; }
    if(done==='rollout'){
      const q=M.queue,v=M.van;
      v.boxes.push({id:q[0].id,row:Math.floor(v.count/4),col:v.count%4});
      v.count++;
      M.queue=[q[1],q[2],{id:M.nextPk++}];
      M.fill=0; M.rollout=null;
    }
    let next;
    switch(done){
      case 'return':  next=M.fill>=99.5?PH.seal:(M.slabs===0?PH.refill:PH.lower); break;
      case 'seal':    M.doorOpen=true; next=PH.rollout; break;
      case 'rollout': M.doorOpen=false;
                      next=M.van.count>=VAN_SLOTS?PH.depart:(M.slabs===0?PH.refill:PH.lower); break;
      case 'depart':  M.van={boxes:[],count:0,id:M.van.id+1}; M.trips++;
                      next=M.slabs===0?PH.refill:PH.lower; break;
      case 'refill':  M.slabs=5; M.hidden=-1; M.refills++; M.cure=0; M.batch++;
                      next=PH.lower; break;
      default: next=M.ph+1;
    }
    if(next===PH.lift) M.hidden=M.lifted%5;
    if(next===PH.rollout) M.rollout={id:M.queue[0].id,col:M.van.count%4,row:Math.floor(M.van.count/4)};
    M.ph=next; M.t=Math.max(0,M.t);

  useEffect(()=>{
    if(!running) return;
    last.current=performance.now();
    const step=now=>{
      const dt=Math.min(64,now-last.current); last.current=now; const s=speedRef.current;
      M.elapsed+=dt*s/1000;
      M.cure=Math.min(100,M.cure+dt*s*(100/140000));
      if(M.doorOpen) M.exposure+=dt*s/1000;
      M.t+=dt*s/PHASES[M.ph].dur;
      let g=0; while(M.t>=1&&g++<5) advance();
      force(v=>v+1);
      raf.current=requestAnimationFrame(step);

    raf.current=requestAnimationFrame(step);

  const resetLine=()=>{ Object.assign(M,init()); force(v=>v+1); };

/* ============================ SALES CHART ============================ */
function SalesChart({stats, n}){
  const {perDay, priorPerDay}=stats;
  const W=760,H=290,PL=46,PR=12,PT=18,PB=30;
  const plotW=W-PL-PR, plotH=H-PT-PB;
  const maxV=Math.max(...perDay.map(d=>d.units), ...priorPerDay.map(d=>d.units));
  const nice=Math.max(400, Math.ceil(maxV/400)*400);
  const y=v=>PT+plotH-(v/nice)*plotH;
  const nD=perDay.length, band=plotW/nD;
  const bw=Math.min(band*0.55, nD>16?11:30);
  const xC=i=>PL+band*i+band/2;
  const [hov,setHov]=useState(null);
  const step=Math.ceil(nD/9);
  const line=priorPerDay.map((d,i)=>(i?'L':'M')+xC(i).toFixed(1)+','+y(d.units).toFixed(1)).join(' ');
  const hd=d=>d.date.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
  const peak=perDay.reduce((a,b)=>b.units>a.units?b:a);
  return (
    <div>
      <div className="relative">
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto block" onMouseLeave={()=>setHov(null)} role="img"
          aria-label={`Daily ice sales for the last ${n} days with previous period trend`}>
          {[0.25,0.5,0.75,1].map(g=>
            <g key={g}>
              <line x1={PL} x2={W-PR} y1={y(nice*g)} y2={y(nice*g)} stroke="rgba(15,110,117,.12)" strokeDasharray="3 5"/>
              <text x={PL-8} y={y(nice*g)+3} textAnchor="end" fontSize="10" fill="rgba(11,58,64,.5)" fontFamily="'Space Grotesk',sans-serif">{fmtK(nice*g)}</text>
            </g>)}
          <line x1={PL} x2={W-PR} y1={PT+plotH} y2={PT+plotH} stroke="rgba(15,110,117,.35)"/>
          <path d={line} fill="none" stroke="rgba(11,58,64,.4)" strokeWidth="1.5" strokeDasharray="5 4"/>
          {priorPerDay.map((d,i)=><circle key={i} cx={xC(i)} cy={y(d.units)} r="2" fill="rgba(11,58,64,.45)"/>)}
          {perDay.map((d,i)=>{ const h=hov===i; return (
            <g key={i}>
              <rect x={xC(i)-bw/2} y={y(d.units)} width={bw} height={PT+plotH-y(d.units)} rx="2"
                fill={h?'#0B565C':'#0F6E75'} opacity={h?1:(i===nD-1?1:.82)}/>
              {i===nD-1&&<text x={xC(i)} y={y(d.units)-5} textAnchor="middle" fontSize="10" fontWeight="600"
                fontFamily="'Space Grotesk',sans-serif" fill="#0B3A40">{fmtK(d.units)}</text>}
              <rect x={PL+band*i} y={PT} width={band} height={plotH} fill="transparent" onMouseEnter={()=>setHov(i)}/>
            </g>);})}
          {perDay.map((d,i)=> i%step===0
            ?<text key={'l'+i} x={xC(i)} y={H-10} textAnchor="middle" fontSize="10" fill="rgba(11,58,64,.55)"
              fontFamily="'DM Sans',sans-serif">{d.date.getDate()+' '+d.date.toLocaleDateString('en-IN',{month:'short'})}</text>
            :null)}
        </svg>
        {hov!=null&&(()=>{ const d=perDay[hov], p=priorPerDay[hov];
          const diff=p?Math.round(100*(d.units-p.units)/p.units):null;
          const yPct=(y(d.units)/H)*100;
          const isNearTop=yPct<22;
          return (
            <div className={`absolute pointer-events-none z-10 -translate-x-1/2 ${isNearTop?'translate-y-3':'-translate-y-full'}`}
              style={{left:`${(xC(hov)/W)*100}%`, top:`${yPct}%`}}>
              <div className="rounded-lg bg-abyss/95 text-mist px-3 py-2 text-xs shadow-lg whitespace-nowrap">
                <p className="font-grot font-semibold">{hd(d)}</p>
                <p>{fmtN(d.units)} units · {fmtINR(d.units*PRICE_PER_UNIT)}</p>
                {diff!=null&&<p className={`flex items-center gap-1 ${diff>=0?'text-brand':'text-[#FFA38F]'}`}>
                  <I n={diff>=0?'up':'down'} className="w-3 h-3"/>{Math.abs(diff)}% vs prior</p>}
              </div>
            </div>);})()}
      </div>
      <div className="mt-3 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-deep/60">
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-lagoon"/>This period</span>
        <span className="flex items-center gap-1.5"><span className="w-4 border-t-2 border-dashed border-deep/50"/>Previous {n} days</span>
        <span className="ml-auto">Peak: <b className="font-grot">{hd(peak)}</b> · {fmtN(peak.units)} units</span>
      </div>
    </div>);
}

    if(selCustomer&&o.customer!==selCustomer) return false;
    if(query){ const q=query.toLowerCase();
      if(!o.customer.toLowerCase().includes(q)&&!o.id.toLowerCase().includes(q)) return false; }
    return true;
  }),[orders,query,selCustomer]);
  const [all,setAll]=useState(false);
  useEffect(()=>setAll(false),[query,selCustomer]);
  const rows=all?filtered:filtered.slice(0,9);
  const tot=filtered.reduce((a,o)=>({u:a.u+o.units,b:a.b+o.boxes,a:a.a+o.amount}),{u:0,b:0,a:0});
  const pill={
    'Delivered':'bg-lagoon/10 text-lagoon border-lagoon/30',
    'In transit':'border-deep/35 text-deep/80',
    'Loading bay':'bg-brand/30 border-brand/70 text-deep',
    'Crushing':'border-lagoon/40 text-lagoon',
    'On hold':'bg-coral/10 border-coral/35 text-coraldeep',

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
        <p className="text-xs text-deep/60">

            <button onClick={clearSel} className="underline underline-offset-2 hover:text-coraldeep">clear</button></>}
        </p>
        {filtered.length>9&&
          <button onClick={()=>setAll(a=>!a)} className="text-xs font-grot text-lagoon hover:underline">
            {all?'Show recent only':'Show all '+filtered.length}</button>}
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-sm min-w-[720px]">
          <caption className="sr-only">Recent ice orders</caption>
          <thead>
            <tr className="text-left text-[10px] tracking-[0.14em] uppercase text-deep/55 font-grot border-b border-lagoon/20">

              <th scope="col" className="py-2 px-3 font-semibold text-right">Boxes</th>
              <th scope="col" className="py-2 px-3 font-semibold text-right">Amount</th>

              <tr key={o.id} className="hover:bg-brand/15 transition">
                <td className="py-2.5 pr-3 font-grot font-medium whitespace-nowrap">{o.id}{o.live&&<span className="ml-1.5 inline-block w-1.5 h-1.5 rounded-full bg-lagoon live-pulse align-middle" aria-label="live"/>}</td>
                <td className="py-2.5 pr-3">{o.customer}</td>

                <td className="py-2.5 px-3 text-right font-grot tabular-nums">{o.boxes}</td>
                <td className="py-2.5 px-3 text-right font-grot tabular-nums whitespace-nowrap">{fmtINR(o.amount)}</td>

function StationView({plant, onLogout}){
  const reduced=usePrefersReducedMotion();
  const base=useMemo(()=>buildData(plant).at(-1).byCustomer,[plant]);
  const [counts,setCounts]=useState(base);
  const [un,setUn]=useState(0);
  const [sel,setSel]=useState(null);
  const [events,setEvents]=useState([]);
  const [last,setLast]=useState(null);
  const boxNo=useRef(141);
  const selRef=useRef(sel); selRef.current=sel;

  const rec=(ci,w,manual)=>{
    if(ci!=null) setCounts(c=>{ const n=c.slice(); n[ci]+=25; return n; });
    else setUn(u=>u+25);
    const ev={ci,w:manual?null:w,ts:new Date(),manual,n:boxNo.current++};
    setEvents(e=>[ev,...e].slice(0,30)); setLast(ev);
  };
  const fire=useRef(()=>{});
  fire.current=()=>rec(selRef.current, +(KG_PER_UNIT*UNITS_PER_BOX+1.85+Math.random()*2.4-1.2).toFixed(2), false);
  useBoxStream(true, fire);

  const undo = () => {
    if (!events.length) return;
    const ev = events[0];
    setEvents(e => e.slice(1));
    if (ev.ci != null) setCounts(c => { const n = c.slice(); n[ev.ci] = Math.max(0, n[ev.ci] - 25); return n; });
    else setUn(u => Math.max(0, u - 25));
    setLast(events[1] || null);
  };
  const totalBoxes=Math.round((counts.reduce((a,b)=>a+b,0)+un)/25);

  return (
    <div className="min-h-screen hmi-plain" style={{background:'#07282D'}}>
      <div className="max-w-lg mx-auto px-4 py-5">
        <div className="flex items-center gap-2.5">
          <Logo size={26}/>
          <div>
            <p className="font-grot font-bold text-mist leading-none">IceFlow Station</p>
            <p className="text-[9px] tracking-[0.2em] text-brand/60 font-grot mt-0.5">{plant.device} · {plant.name}</p>
          </div>
          <span className="ml-auto flex items-center gap-1.5 text-[10px] font-grot tracking-widest text-brand border border-brand/30 rounded px-1.5 py-0.5">
            <span className="w-1.5 h-1.5 rounded-full bg-brand live-pulse"/>SENSOR LIVE</span>
          <button onClick={onLogout} aria-label="Log out" className="icon-btn-dark"><I n="logout" className="w-4 h-4"/></button>
        </div>

        <div className="mt-5 rounded-2xl border border-brand/20 bg-brand/5 p-4">
          <div className="flex items-baseline justify-between">
            <p className="overline-dark">Packing for</p>
            <p className="text-[11px] text-brand/60 font-grot">PLANT TOTAL · {totalBoxes} BOXES</p>
          </div>
          <p aria-live="polite" className="font-grot font-bold text-brand text-6xl leading-none mt-2 tabular-nums">
            {sel!=null?Math.round(counts[sel]/25):'—'}
            {sel!=null&&<span className="text-base font-sans font-normal text-brand/60"> boxes · {CUSTOMERS[sel].short}</span>}
          </p>
          <p className="text-xs text-brand/60 mt-2 font-grot">
            {last?`LAST · PK-0${last.n} · ${last.w?last.w+' kg':'manual'} · ${hhmm(last.ts)} · ${last.ci!=null?CUSTOMERS[last.ci].short:'UNASSIGNED'}`:'Waiting for first box…'}
          </p>
        </div>

        {sel==null&&
          <p role="status" className="mt-3 flex items-center gap-2 text-xs font-grot tracking-wide text-[#FFA38F] border border-coral/50 bg-coral/10 rounded-lg px-3 py-2">
            <I n="alert" className="w-4 h-4 shrink-0"/>SELECT A CUSTOMER — boxes are billed per account</p>}

        <p className="overline-dark mt-5 mb-2">Customer</p>
        <div className="grid grid-cols-2 gap-2">
          {CUSTOMERS.map((c,i)=>{
            const active=sel===i;
            return (
              <button key={c.name} onClick={()=>setSel(active?null:i)} aria-pressed={active}
                className={`rounded-xl border px-3 py-3 text-left transition min-h-[4.5rem] ${
                  active?'border-brand bg-brand text-abyss':'border-brand/25 bg-brand/5 text-mist hover:bg-brand/15'}`}>
                <span className="block font-grot font-semibold text-base leading-tight">{c.short}</span>
                <span className={`block text-[11px] mt-0.5 ${active?'text-abyss/70':'text-brand/60'}`}>
                  {Math.round(counts[i]/25)} boxes today</span>
              </button>);})}
        </div>

        <div className="grid grid-cols-2 gap-2 mt-4">
          <button onClick={()=>rec(sel, null, true)}
            className="h-14 rounded-xl bg-brand text-abyss font-grot font-bold text-base flex items-center justify-center gap-2 hover:bg-white transition">
            <I n="plus" className="w-5 h-5"/>+1 box · manual</button>
          <button onClick={undo} disabled={!events.length}
            className="h-14 rounded-xl border border-brand/30 text-brand font-grot font-semibold text-base flex items-center justify-center gap-2 hover:bg-brand/10 transition disabled:opacity-40 disabled:hover:bg-transparent">
            <I n="reset" className="w-5 h-5"/>Undo last</button>
        </div>

        <div className="flex items-center justify-between text-[11px] text-brand/50 mt-4 px-1">
          <span>Scale: RS-232 · Tare 1.85 kg</span>
          <span>Unassigned today: <b className="text-[#FFA38F] font-grot">{Math.round(un/25)}</b> boxes</span>
        </div>
      </div>
    </div>);
}

/* ============================ DEVICE STRIP ============================ */
function DeviceStrip({plant, dev, live, feed, attrib, setAttrib, nowTs, onToggle, onOutage}){
  const ago=ts=>{ const s=Math.max(0,Math.round((nowTs-ts)/1000));
    return s<4?'just now':s<60?s+' s ago':Math.floor(s/60)+' m ago'; };
  const chips=[
    ['Heartbeat', !live?'—': dev.online?ago(dev.lastBeat):'offline '+ago(dev.lastBeat)],
    ['Buffer',    dev.pending>0?dev.pending+' events pending':'0 pending'],
    ['Power',     dev.online?'Grid · UPS ok':'On battery'],
    ['Signal',    'WiFi −52 dBm'],
    ['Sensor',    'Scale · RS-232 stable-wt'],
    ['Tare',      '1.85 kg · +2.0 trip'],
  ];
  const bad=!live?null:(dev.online?(dev.pending>0?'warn':'ok'):'bad');
  return (
    <section id="device" className="glass p-4 sm:p-5 scroll-mt-20" aria-label="Edge device status">
      <div className="flex flex-wrap items-center gap-3">
        <span className={`w-9 h-9 rounded-lg grid place-items-center shrink-0 ${
          bad==='bad'?'bg-coral/12 text-coraldeep':'bg-lagoon/12 text-lagoon'}`}><I n="cpu" className="w-5 h-5"/></span>
        <div>
          <p className="overline">Edge device</p>
          <p className="font-grot font-semibold text-sm flex items-center gap-2">
            {plant.device} · {plant.name}
            {!live&&<span className="text-[10px] font-grot tracking-widest px-1.5 py-0.5 rounded border border-lagoon/30 text-deep/55">STREAM OFF</span>}
            {live&&dev.online&&<span className="flex items-center gap-1 text-[10px] font-grot tracking-widest px-1.5 py-0.5 rounded border border-lagoon/40 text-lagoon bg-lagoon/5">
              <span className="w-1.5 h-1.5 rounded-full bg-lagoon live-pulse"/>ONLINE</span>}
            {live&&!dev.online&&<span className="flex items-center gap-1 text-[10px] font-grot tracking-widest px-1.5 py-0.5 rounded border border-coral/60 text-coraldeep bg-coral/10">
              <span className="w-1.5 h-1.5 rounded-full bg-coral live-pulse"/>OFFLINE · BUFFERING</span>}
          </p>
        </div>
        <div className="ml-auto flex items-center gap-2">
          <button onClick={onToggle}
            className={`h-9 px-3 rounded-lg font-grot text-sm font-semibold flex items-center gap-1.5 transition ${
              live?'border border-lagoon/25 bg-white/60 text-deep hover:bg-brand/25':'bg-lagoon text-white hover:bg-deep'}`}>
            <I n={live?'pause':'play'} className="w-4 h-4"/>{live?'Pause stream':'Resume stream'}
          </button>
          <button onClick={onOutage} disabled={!live||!dev.online}
            className="h-9 px-3 rounded-lg border border-coral/40 text-coraldeep text-sm font-medium hover:bg-coral/10 transition disabled:opacity-40">
            Simulate outage
          </button>
        </div>
      </div>

      <div className="mt-4 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
        {chips.map(([k,v])=>(
          <div key={k} className="rounded-lg border border-lagoon/15 bg-white/40 px-2.5 py-2">
            <p className="overline">{k}</p>
            <p className={`font-grot text-[13px] mt-0.5 truncate ${k==='Buffer'&&dev.pending>0?'text-coraldeep':k==='Heartbeat'&&live&&!dev.online?'text-coraldeep':''}`}>{v}</p>
          </div>))}
      </div>

      <div className="mt-4 grid lg:grid-cols-[auto_1fr] gap-4 items-start">
        <div>
          <label htmlFor="attrib" className="overline block mb-1">Pack attribution</label>
          <select id="attrib" value={attrib} onChange={e=>setAttrib(e.target.value)} className="sel w-56">
            <option value="auto">Auto — customer mix</option>
            {CUSTOMERS.map((c,i)=><option key={c.name} value={i}>{c.name}</option>)}
          </select>
        </div>
        <div className="min-w-0">
          <p className="overline mb-1">Recent line telemetry</p>
          {feed.length===0
            ?<p className="text-xs text-deep/50">Awaiting live box sensor events...</p>
            :<ul className="space-y-1">
              {feed.map(ev=>(
                <li key={ev.n} className="feed-in flex items-center gap-2 text-xs bg-white/40 border border-lagoon/12 rounded-lg px-2.5 py-1.5">
                  <I n="box" className="w-3.5 h-3.5 text-lagoon shrink-0"/>
                  <span className="font-grot font-medium">PK-0{ev.n}</span>
                  <span className="text-deep/70">{ev.w?ev.w.toFixed(1)+' kg':'manual'}</span>
                  <span className="truncate">{CUSTOMERS[ev.ci]?CUSTOMERS[ev.ci].name:'Unassigned'}</span>
                  <span className="ml-auto text-deep/50 font-grot tabular-nums">{hhmm(ev.ts)}</span>
                  <span className="text-lagoon"><I n="check" className="w-3.5 h-3.5"/></span>
                </li>))}
            </ul>}
        </div>
      </div>
      <p className="mt-3 text-[10px] text-deep/45">
        Industrial IoT edge gateway · Firmware v1.3.2 · Automated on-device buffer synchronization active.
      </p>
    </section>);
}

/* ============================ DASHBOARD ============================ */
const NAV=[['overview','Overview','dash'],['device','Edge Device','cpu'],['orders','Order Book','truck'],['customers','Customers','users'],['production','Production Line','factory']];
const NOTES=[
  {t:'Order OI-2496 loaded for Bluewave Sea Foods', time:'18 min ago', ic:'truck', unread:true},
  {t:'Crane CR-02 wire inspection due in 2 days',   time:'1 h ago',   ic:'alert', unread:true},
  {t:'Brine tank MD-01 back at −11.4 °C',           time:'3 h ago',   ic:'temp',  unread:false},
];
const ROLE_LABEL={owner:'Plant owner', provider:'Service admin'};

function Dashboard({session, onLogout}){
  const [plantId,setPlantId]=useState('P1');
  const plant = (session.role === 'provider' ? PLANTS.find(p => p.id === plantId) : null) || PLANTS[0];
  const pRef=useRef(plant); pRef.current=plant;

  const [days,setDays]=useState(()=>buildData(plant));
  const [orders,setOrders]=useState(()=>buildOrders(plant));
  const [range,setRange]=useState('7d');
  const n=parseInt(range,10);
  const stats=useMemo(()=>rangeStats(days,n),[days,n]);
  const [query,setQuery]=useState('');
  const [selCustomer,setSelCustomer]=useState(null);
  const [bellOpen,setBellOpen]=useState(false);
  const [notes,setNotes]=useState(NOTES);
  const [navOpen,setNavOpen]=useState(false);
  const [active,setActive]=useState('overview');
  const [toasts,setToasts]=useState([]);
  const [live,setLive]=useState(true);
  const [dev,setDev]=useState({online:true,pending:0,lastBeat:Date.now()});
  const [feed,setFeed]=useState([]);
  const [attrib,setAttrib]=useState('auto');
  const [nowTs,setNowTs]=useState(Date.now());
  const boxNo=useRef(141), nextOrd=useRef(0), buffer=useRef([]), outRef=useRef();
  const onlineRef=useRef(true); onlineRef.current=dev.online;
  const bellRef=useRef(null);
  const reduced=usePrefersReducedMotion();

  const pushToast=useCallback(msg=>{
    const id=Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3800);
  },[]);

  /* plant switch → rebuild data for selected plant */
  useEffect(()=>{
    const d=buildData(plant), o=buildOrders(plant);
    setDays(d); setOrders(o);
    nextOrd.current=+o[0].id.slice(3)+1;
    boxNo.current=141; setFeed([]); buffer.current=[];
    clearTimeout(outRef.current);
    setDev({online:true,pending:0,lastBeat:Date.now()});
    setLive(true);
  },[plant]);

  const applyBox=useCallback(({ts,w,ci})=>{
    setDays(prev=>{ const cp=prev.slice(); const last={...cp[cp.length-1]};
      last.units+=25; const bc=last.byCustomer.slice(); bc[ci]+=25; last.byCustomer=bc;
      cp[cp.length-1]=last; return cp; });
    setOrders(prev=>[{id:'OI-'+(nextOrd.current++), customer:CUSTOMERS[ci].name, units:25, boxes:1,
      amount:25*PRICE_PER_UNIT, when:ts, status:'Loading bay', timeLabel:timeLabel(ts), live:true}, ...prev]);
    setFeed(f=>[{n:boxNo.current++, w, ts, ci}, ...f].slice(0,6));
  },[]);

  const emitBox=useCallback(()=>{
    const ci=attrib==='auto'?weightedCi():+attrib;
    const w=+(KG_PER_UNIT*UNITS_PER_BOX+1.85+Math.random()*2.4-1.2).toFixed(2);
    const ts=new Date();
    if(!onlineRef.current){ buffer.current.push({ts,w,ci});
      setDev(d=>({...d,pending:buffer.current.length})); return; }
    applyBox({ts,w,ci});
  },[attrib,applyBox]);
  const fire=useRef(()=>{}); fire.current=emitBox;
  useBoxStream(live, fire);

  /* heartbeat + 1 s ticker (drives "Xs ago" and outage clock) */
  useEffect(()=>{
    if(!live) return;
    const id=setInterval(()=>{ setNowTs(Date.now());
      setDev(d=>d.online&&Date.now()-d.lastBeat>5000?{...d,lastBeat:Date.now()}:d); },1000);
    return()=>clearInterval(id);
  },[live]);

  /* age out live orders from "Loading bay" to "In transit" after 3 min */
  useEffect(()=>{
    if(!live) return;
    const id=setInterval(()=>setOrders(o=>o.map(x=>
      x.live&&x.status==='Loading bay'&&(Date.now()-x.when.getTime())>180000
        ?{...x,status:'In transit'}:x)),30000);
    return()=>clearInterval(id);
  },[live]);

  const reconnect=useCallback(()=>{
    setDev(d=>({...d,online:true,power:'grid'}));
    const b=buffer.current; buffer.current=[];
    b.forEach(applyBox);
    setDev(d=>({...d,pending:0,lastBeat:Date.now()}));
    const msg=`${pRef.current.device} back online — ${b.length} buffered box${b.length===1?'':'es'} synced`;
    pushToast(msg);
    setNotes(ns=>[{t:msg,time:'Just now',ic:'upload',unread:true},...ns].slice(0,15));
  },[applyBox,pushToast]);

  const testOutage=()=>{
    if(!live||!dev.online) return;
    setDev(d=>({...d,online:false}));
    pushToast('Simulating a 12 s power cut — counting continues on-device');
    outRef.current=setTimeout(reconnect,12000);
  };
  useEffect(()=>()=>clearTimeout(outRef.current),[]);

  const toggleLive=()=>{
    setLive(v=>{
      const nv=!v;
      if(nv){ buffer.current=[]; setDev({online:true,pending:0,lastBeat:Date.now()}); pushToast('Live simulation started — boxes will flow into today\u2019s numbers'); }
      else { clearTimeout(outRef.current); pushToast('Stream stopped — sample data frozen'); }
      return nv; });
  };

  useEffect(()=>{
    if(!bellOpen) return;
    const f=e=>{ if(bellRef.current&&!bellRef.current.contains(e.target)) setBellOpen(false); };
    document.addEventListener('mousedown',f);
    return()=>document.removeEventListener('mousedown',f);
  },[bellOpen]);

  useEffect(()=>{
    const obs=new IntersectionObserver(es=>{
      es.forEach(e=>{ if(e.isIntersecting) setActive(e.target.id); });
    },{rootMargin:'-25% 0px -60% 0px'});
    ['overview','device','orders','customers','production'].forEach(id=>{
      const el=document.getElementById(id); if(el) obs.observe(el);
    });
    return()=>obs.disconnect();
  },[]);

  const onNav=id=>{
    setActive(id); setNavOpen(false);
    const el=document.getElementById(id);
    if(el) el.scrollIntoView({behavior:reduced?'auto':'smooth'});
  };

  const exportCSV=()=>{
    const rows=[['Order ID','Customer','Ice units','Boxes','Amount (INR)','Time','Status']];
    orders.filter(o=>{
      if(selCustomer&&o.customer!==selCustomer) return false;
      if(query){ const q=query.toLowerCase();
        return o.customer.toLowerCase().includes(q)||o.id.toLowerCase().includes(q); }
      return true;
    }).forEach(o=>rows.push([o.id,o.customer,o.units,o.boxes,o.amount,o.timeLabel,o.status]));
    const orderCount=rows.length-1;
    rows.push([],['Range','last '+n+' days'],['Total units',stats.units],
      ['Revenue @ ₹80/unit',stats.revenue],['Boxes',stats.boxes],
      ['Units/box',UNITS_PER_BOX],['Active customers',stats.customers.length]);
    const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    const a=document.createElement('a'); a.href=url; a.download=`iceflow-${plant.id}-orders-${range}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    pushToast(`Order book exported — ${orderCount} orders in CSV`);
  };

  const unread=notes.filter(x=>x.unread).length;
  const up=stats.delta>=0;
  const sparkVs=days.slice(-14).map(d=>d.units);
  const sMin=Math.min(...sparkVs), sMax=Math.max(...sparkVs);
  const sPt=(v,i)=>`${(i/(sparkVs.length-1))*140},${36-((v-sMin)/((sMax-sMin)||1))*28}`;
  const initials=c=>c.name.split(' ').map(w=>w[0]).slice(0,2).join('');
  const staged=Math.max(4,Math.round(stats.boxes*0.03));
  const todayBoxes=Math.round(days.at(-1).units/25);

  return (
    <div className="min-h-screen">
      {navOpen&&<div className="fixed inset-0 bg-abyss/50 z-40 lg:hidden" onClick={()=>setNavOpen(false)} aria-hidden="true"/>}
      <aside aria-label="Primary navigation"
        className={`fixed inset-y-0 left-0 z-50 w-64 flex flex-col transition-transform duration-300 lg:translate-x-0 ${navOpen?'translate-x-0':'-translate-x-full'}`}
        style={{background:'#07282D', backgroundImage:'radial-gradient(420px 240px at 0% 0%, rgba(157,229,229,.09), transparent 60%)'}}>
        <div className="flex items-center gap-2.5 px-5 h-16 border-b border-brand/10">
          <Logo size={30}/>
          <div>
            <p className="font-grot font-bold text-mist text-lg leading-none">IceFlow</p>
            <p className="text-[9px] tracking-[0.22em] text-brand/60 font-grot mt-0.5">PLANT OS</p>
          </div>
          <button className="ml-auto icon-btn-dark lg:hidden" onClick={()=>setNavOpen(false)} aria-label="Close menu">
            <I n="x" className="w-4 h-4"/></button>
        </div>
        {session.role==='provider'&&
          <div className="px-3 pt-4">
            <label htmlFor="plantsel" className="overline-dark block mb-1">Client plant</label>
            <select id="plantsel" value={plantId} onChange={e=>setPlantId(e.target.value)} className="sel-dark">
              {PLANTS.map(p=><option key={p.id} value={p.id} className="text-ink">{p.name}</option>)}
            </select>
          </div>}
        <nav className="flex-1 px-3 py-4 space-y-1">
          {NAV.map(([id,label,ic])=>(
            <button key={id} onClick={()=>onNav(id)} aria-current={active===id?'page':undefined}
              className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition border-l-2 ${
                active===id?'bg-brand/10 text-brand border-brand':'text-mist/70 border-transparent hover:bg-brand/5 hover:text-mist'}`}>
              <I n={ic} className="w-4 h-4 shrink-0"/>{label}
            </button>))}
        </nav>
        <div className="px-4 pb-5">
          <div className="rounded-xl border border-brand/15 bg-brand/5 p-3">
            <div className="flex items-center gap-2 text-mist text-xs font-grot tracking-wider">
              <I n="temp" className="w-3.5 h-3.5 text-brand"/>COLD ROOM 02
            </div>
            <p className="font-grot text-2xl text-mist mt-1">−11.4<span className="text-sm text-brand/70"> °C</span></p>
            <p className="text-[11px] text-brand/60 mt-0.5 flex items-center gap-1.5">
              <span className="w-1.5 h-1.5 rounded-full bg-brand live-pulse"/>94% RH · brine nominal</p>
          </div>
          <div className="flex items-center gap-2 mt-3 px-1">
            <span className="w-7 h-7 rounded-full bg-lagoon/15 border border-lagoon/40 text-brand text-[10px] font-grot font-semibold grid place-items-center">
              {session.name.split(' ').map(w=>w[0]).slice(0,2).join('')}</span>
            <div className="min-w-0">
              <p className="text-xs text-mist truncate">{session.name}</p>
              <p className="text-[10px] text-brand/50">{ROLE_LABEL[session.role]}</p>
            </div>
            <button onClick={onLogout} aria-label="Log out" className="ml-auto icon-btn-dark"><I n="logout" className="w-4 h-4"/></button>
          </div>
          <p className="text-[10px] text-brand/40 mt-2 px-1 font-grot tracking-wider">HMI v2.5 · FW v1.3.2 · LINK OK</p>
        </div>
      </aside>

      <main className="lg:pl-64">
        <div className="max-w-[1240px] mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-5">
          <div className="lg:hidden flex items-center gap-3">
            <button className="icon-btn" onClick={()=>setNavOpen(true)} aria-label="Open menu"><I n="menu" className="w-5 h-5"/></button>
            <Logo size={26}/><span className="font-grot font-bold text-lg">IceFlow</span>
            <button onClick={onLogout} aria-label="Log out" className="ml-auto icon-btn"><I n="logout" className="w-4 h-4"/></button>
          </div>

          <header id="overview" className="scroll-mt-20 flex flex-col gap-4 xl:flex-row xl:items-end xl:justify-between">
            <div>
              <div className="flex items-center gap-2">
                <p className="overline">IceFlow service · {plant.name}</p>
                <button onClick={toggleLive}
                  className={`flex items-center gap-1.5 text-[9px] font-grot tracking-widest px-1.5 py-0.5 rounded border transition ${
                    live&&dev.online?'border-lagoon/50 text-lagoon hover:bg-lagoon/10'
                    :live&&!dev.online?'border-coral/60 text-coraldeep bg-coral/10'
                    :'border-lagoon/30 text-deep/55 hover:bg-lagoon/10'}`}>
                  <span className={`w-1.5 h-1.5 rounded-full ${live&&dev.online?'bg-lagoon live-pulse':live?'bg-coral live-pulse':'bg-deep/30'}`}/>
                  {live&&dev.online?'LIVE TELEMETRY':live?'OFFLINE · BUFFERING':'STREAM PAUSED'}
                </button>
              </div>
              <h1 className="font-grot text-3xl sm:text-4xl font-bold mt-1.5 tracking-tight">Keep the cold moving.</h1>
              <p className="text-sm text-deep/65 mt-1.5 max-w-xl">Every box weighed &amp; counted at PK-01 by the edge device — priced at ₹80 per unit, 25 units per box, {todayBoxes} boxes today.</p>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <div className="relative w-full sm:w-60">
                <I n="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-deep/45"/>
                <input type="search" value={query} onChange={e=>setQuery(e.target.value)}
                  className="field" placeholder="Search customers or orders…" aria-label="Search customers or orders"/>
              </div>
              <div className="flex rounded-lg border border-lagoon/25 bg-white/60 overflow-hidden text-sm font-grot" role="group" aria-label="Date range">
                {[['7','7D'],['14','14D'],['30','30D']].map(([v,l])=>
                  <button key={v} onClick={()=>setRange(v)} aria-pressed={range===v}
                    className={`px-3 py-1.5 transition ${range===v?'bg-lagoon text-white':'text-deep/70 hover:bg-brand/25'}`}>{l}</button>)}
              </div>
              <button onClick={exportCSV}
                className="h-9 px-3 rounded-lg border border-lagoon/25 bg-white/60 text-sm font-medium text-deep flex items-center gap-1.5 hover:bg-brand/25 transition">
                <I n="download" className="w-4 h-4"/>Export</button>
              <div className="relative" ref={bellRef}>
                <button className="icon-btn" aria-label={`Notifications, ${unread} unread`} aria-expanded={bellOpen}
                  onClick={()=>{
                    const willOpen = !bellOpen;
                    setBellOpen(willOpen);
                    if(willOpen) setNotes(ns=>ns.map(x=>({...x,unread:false})));
                  }}>
                  <I n="bell" className="w-4 h-4"/>
                  {unread>0&&<span className="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-coral text-white text-[10px] font-bold grid place-items-center">{unread}</span>}
                </button>
                {bellOpen&&
                  <div className="absolute right-0 mt-2 w-80 glass p-2 z-30" role="dialog" aria-label="Notifications">
                    {notes.map((nt,i)=>(
                      <div key={i} className="flex gap-3 px-2 py-2.5 rounded-lg hover:bg-brand/15 transition">
                        <span className={`mt-0.5 w-7 h-7 rounded-lg grid place-items-center shrink-0 ${nt.ic==='alert'?'bg-coral/12 text-coraldeep':'bg-lagoon/12 text-lagoon'}`}>
                          <I n={nt.ic} className="w-3.5 h-3.5"/></span>
                        <div className="min-w-0">
                          <p className="text-xs leading-snug">{nt.t}</p>
                          <p className="text-[10px] text-deep/50 mt-0.5">{nt.time}</p>
                        </div>
                        {nt.unread&&<span className="ml-auto mt-1 w-1.5 h-1.5 rounded-full bg-coral shrink-0"/>}
                      </div>))}
                  </div>}
              </div>
            </div>
          </header>

          <DeviceStrip plant={plant} dev={dev} live={live} feed={feed}
            attrib={attrib} setAttrib={setAttrib} nowTs={nowTs}
            onToggle={toggleLive} onOutage={testOutage}/>

          <section aria-label="Key figures" className="grid grid-cols-1 md:grid-cols-12 gap-4">
            <div className="glass p-5 md:col-span-6 flex flex-col">
              <div className="flex items-start justify-between gap-3">
                <div>
                  <p className="overline flex items-center gap-1.5">Total ice sold — last {n} days
                    {live&&dev.online&&<span className="w-1.5 h-1.5 rounded-full bg-lagoon live-pulse" aria-label="live"/>}</p>
                  <p className="font-grot text-[2.6rem] leading-none mt-1.5 tabular-nums">
                    {fmtN(stats.units)}<span className="text-base font-sans font-normal text-deep/55"> units</span></p>
                </div>
                <span className={`inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-grot font-medium ${up?'bg-lagoon/10 text-lagoon':'bg-coral/10 text-coraldeep'}`}>
                  <I n={up?'up':'down'} className="w-3.5 h-3.5"/>{Math.abs(stats.delta).toFixed(1)}%<span className="opacity-60 font-sans">vs prior</span>
                </span>
              </div>
              <svg viewBox="0 0 140 40" className="w-full h-10 mt-3" aria-hidden="true">
                <path d={'M'+sparkVs.map((v,i)=>sPt(v,i)).join(' L')+` L140,40 L0,40 Z`} fill="rgba(15,110,117,.12)"/>
                <path d={'M'+sparkVs.map((v,i)=>sPt(v,i)).join(' L')} fill="none" stroke="#0F6E75" strokeWidth="1.8" strokeLinecap="round"/>
              </svg>
              <div className="mt-auto pt-3 border-t border-lagoon/15 flex flex-wrap items-end justify-between gap-2">
                <div>
                  <p className="overline">Revenue @ ₹80 / unit</p>
                  <p className="font-grot text-2xl text-lagoon mt-0.5 tabular-nums">{fmtINR(stats.revenue)}</p>
                </div>
                <p className="text-xs text-deep/60">{stats.boxes} boxes · {UNITS_PER_BOX} units / box</p>
              </div>
            </div>
            <div className="glass p-5 md:col-span-3 flex flex-col">
              <p className="overline">Boxes handled</p>
              <p className="font-grot text-4xl mt-1.5 tabular-nums">{fmtN(stats.boxes)}</p>
              <div className="mt-3">
                <div className="h-2 rounded-full bg-brand/25 overflow-hidden">
                  <div className="h-full rounded-full bg-lagoon" style={{width:`${100-(100*staged/Math.max(1,stats.boxes))}%`}}/>
                </div>
                <div className="flex justify-between text-[11px] text-deep/60 mt-1.5">
                  <span>Dispatched {fmtN(stats.boxes-staged)}</span><span>Staged {staged}</span>
                </div>
              </div>
              <p className="mt-auto pt-3 text-[11px] text-deep/55">25 units · <b className="font-grot">₹2,000</b> value per box</p>
            </div>
            <div className="glass p-5 md:col-span-3 flex flex-col">
              <p className="overline">Active customers</p>
              <p className="font-grot text-4xl mt-1.5 tabular-nums">{stats.customers.length}</p>
              <div className="flex -space-x-1.5 mt-3" aria-hidden="true">
                {stats.customers.slice(0,3).map(c=>
                  <span key={c.name} title={c.name}
                    className="w-8 h-8 rounded-full bg-lagoon/12 border border-lagoon/40 text-lagoon text-[11px] font-grot font-semibold grid place-items-center">{initials(c)}</span>)}
                {stats.customers.length>3&&
                  <span className="w-8 h-8 rounded-full bg-deep/10 border border-deep/25 text-deep/70 text-[10px] font-grot grid place-items-center">+{stats.customers.length-3}</span>}
              </div>
              <p className="mt-auto pt-3 text-[11px] text-deep/55 truncate">Top account · <b>{stats.customers[0].name}</b> ({stats.customers[0].pct}%)</p>
            </div>
          </section>

          <section aria-label="Sales trend and customer mix" className="grid grid-cols-1 lg:grid-cols-12 gap-4">
            <div className="glass p-5 lg:col-span-7">
              <div className="flex items-start justify-between gap-3 mb-3">
                <div>
                  <p className="overline">Ice sales — last {n} days</p>
                  <p className="text-xs text-deep/55 mt-0.5">Avg sale rate {fmtN(stats.units/n)} units/day · ≈ {fmtINR(stats.units/n*PRICE_PER_UNIT)}/day</p>
                </div>
                <span className={`inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-grot font-medium ${up?'bg-lagoon/10 text-lagoon':'bg-coral/10 text-coraldeep'}`}>
                  <I n={up?'up':'down'} className="w-3.5 h-3.5"/>{Math.abs(stats.delta).toFixed(1)}%</span>
              </div>
              <SalesChart stats={stats} n={n}/>
            </div>
            <div id="customers" className="glass p-5 lg:col-span-5 scroll-mt-20">
              <div className="flex items-start justify-between mb-3">
                <div>
                  <p className="overline">Customer sales mix</p>
                  <p className="text-xs text-deep/55 mt-0.5">{stats.customers.length} accounts · last {n} days</p>
                </div>
                <I n="users" className="w-4 h-4 text-lagoon/60"/>
              </div>
              <CustomerMix customers={stats.customers} sel={selCustomer} onSel={setSelCustomer}/>
            </div>
          </section>

          <section id="orders" className="glass p-5 scroll-mt-20">
            <div className="flex items-start justify-between mb-3">
              <div>
                <p className="overline">Recent orders</p>
                <p className="text-xs text-deep/55 mt-0.5">Order book · amounts at ₹80 / unit · live boxes appear at top</p>
              </div>
              <I n="truck" className="w-4 h-4 text-lagoon/60"/>
            </div>
            <OrdersTable orders={orders} query={query} selCustomer={selCustomer} clearSel={()=>setSelCustomer(null)}/>
          </section>

          <div className="flex items-end justify-between gap-3 pt-2">
            <div>
              <p className="overline">Plant floor</p>
              <h2 className="font-grot text-xl font-semibold mt-0.5">Crush, pack &amp; load-out — live</h2>
            </div>
            <p className="text-xs text-deep/55 max-w-xs text-right hidden sm:block">Slabs leave the brine moulds by gantry crane, get crushed, packed in lined boxes and loaded into sealed cold vans. PK-01 is where the IceFlow device counts every box. Click any stage to inspect it.</p>
          </div>
          <ProductionLine/>

          <footer className="glass p-4 flex flex-wrap items-center gap-3 text-xs text-deep/60">
            <Logo size={22}/>
            <p className="max-w-lg">IceFlow Plant OS — real-time box verification, automated scale telemetry, and cold-chain compliance monitoring.</p>
            <p className="ml-auto font-grot tracking-wider text-deep/50">₹80 / UNIT · 25 UNITS / BOX · {plant.device}</p>
          </footer>
        </div>
      </main>

      <div className="fixed bottom-4 right-4 z-[60] space-y-2" aria-live="polite">
        {toasts.map(t=>(
          <div key={t.id} className="toast-in flex items-center gap-2.5 rounded-lg bg-abyss text-mist px-4 py-3 text-sm shadow-xl border border-brand/20 max-w-xs">
            <I n="check" className="w-4 h-4 text-brand shrink-0"/>{t.msg}
          </div>))}
      </div>
    </div>);
}

/* ============================ APP (session gate) ============================ */
const NAMES={owner:'Priya M.', operator:'Bench 01', provider:'IceFlow Service'};
function App(){
  const [session,setSession]=useState(null);
  const onLogin=role=>setSession({role, name:NAMES[role]});
  if(!session) return <LoginScreen onLogin={onLogin}/>;
  if(session.role==='operator') return <StationView plant={PLANTS[0]} onLogout={()=>setSession(null)}/>;
  return <Dashboard session={session} onLogout={()=>setSession(null)}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
